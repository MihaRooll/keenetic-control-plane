blockers:
  - id: "gate-a-identity-drift-20260801"
    scope: "live_writes"
    status: resolved
    observed_on: "2026-08-01"
    resolved_on: "2026-08-01"
    root_cause: "**Defect in our own identity parser, NOT a device change.** `identity.py` treated an `installed: \"<version string>\"` marker as an unrecognised boolean (→ excluded) and treated a bare `version` with no `installed` key as installed (→ included). Measured live: 40 entries carry an `installed` marker, 54 were counted as installed, **overlap zero** — the Gate A component digest fingerprinted the vendor catalogue instead of the device's installed set, so a vendor catalogue refresh moved device identity with nothing happening on the hardware. Exhaustive single/pair add-remove-swap search failed to reproduce the recorded digest, consistent with this explanation and inconsistent with a real component change."
    resolution: "Parser corrected (`component-set-v2`, MODE A/B). Fresh pinned probe after the fix matches the recorded tuple in **all nine** compared fields — component_set_digest sha256:23bd35bc… and device_fingerprint sha256:c34adec4… both MATCH; drifted_fields=0. Certified tuple was correct all along and was **NOT** modified; no rebind performed or needed. Evidence: data/artifacts/gate-a-probe-post-parser-fix-20260801.json (sha256 f3dd1c328edb6546925e6f19cb0e2f62bc213e66942975508feebe8304e187d2, recorded 2026-08-01T21:28:28Z, source 192.168.2.10). Side findings: `wireguard` IS installed; `chilli` (captive portal) is NOT — both readings were inverted under the old parser."
    residual: "None. The stale-evidence residual was closed on 2026-08-02 by an evidence-freshness recertification with the **certified tuple unchanged byte-for-byte** (see gates.A.recertification_note); live tooling verified working afterwards (topology probe exit 0, guest Wi-Fi campaign applied+verified+torn down)."
    description: "Read-only pinned Gate A probe from 192.168.2.10 against 192.168.2.1 succeeded (exit 0) but observed tuple DIFFERS from recorded tuple in exactly two fields: component_set_digest sha256:23bd35bc… → **sha256:479a368c2fb39af9e3fb6628cf90a63ca8139bd757adf56ca2225900d32bb97c**; device_fingerprint sha256:c34adec4… → **sha256:11859ce42fa2732bdcda545e8c9785fa7be852778c5306dc3ae127d342e21075**. UNCHANGED: ssh host key SHA256:RUi/peC9rUzYMT/CIgeIsBYjR5CFqYxxnCuUmfv2WkY, firmware 5.01.C.1.0-0, ndm_build 0-b592e619a0, bsp_build 0-f371d30955, channel Main, region EA, model NC-1812. Evidence: data/artifacts/gate-a-probe-campaign-20260801.json. Inference (NOT directly observed): installed component set changed on the same physical unit — same drift class as 2026-07-31 post-WG install. Component enumeration via non-certifying bootstrap discovery FAILED (device terminated TLS handshake on management HTTPS: SSL UNEXPECTED_EOF_WHILE_READING); no further probing attempted."
    effect: "Live writes on 192.168.2.1 are FAIL-CLOSED per DEDICATED_ROUTER_LAB_POLICY.md (live device != recorded tuple). Read-only observation and offline work unaffected."
    resolution_gate: "Human decision required — see docs/HUMAN_GATE_GATE_A_IDENTITY_DRIFT_20260801.md (Option A authorized rebind / Option B investigate first / Option C treat as uncharacterised). Gate A status, certified tuple, and gate-a-certification.json were NOT modified by the observing agent."
  - id: "wg-component-lab-connectivity-20260731"
    scope: "lab_connectivity"
    status: resolved
    resolved_on: "2026-07-31"
    description: "WireGuard component install on expendable lab unit (NC-1812 fw 5.01.C.1.0-0, Gate A ReadOnlyCertified) — **resolved 2026-07-31** after connectivity restored: `install wireguard` succeeded; catalogue required internet; reboot ~87s; host-key UNCHANGED SHA256:RUi/peC9rUzYMT/CIgeIsBYjR5CFqYxxnCuUmfv2WkY; component_set_digest sha256:91145a8284… → sha256:23bd35bc1bcbf8523495ff7fb37ef2ded597ce9d07b9c1c968ae1f9e4aa4de80; backup data/backups/startup-192.168.2.1-20260731T170617Z-ada02223.dpapi. Prior phase-1 failure (no internet, component unavailable) documented in nc1812_wg_component_lab_connectivity_blocker_20260731 review."
    resolution: "Connectivity restored; wireguard component installed; authorized Gate A identity-drift rebind #2 (same day) — component_set_digest and device_fingerprint moved; host key and firmware unchanged (NOT physical device replacement; rebind #1 morning was physical replacement)."
    lesson: "Components::Lister component unavailable can mean no connectivity / stale catalogue — not unsupported hardware."
  - id: "nc1812-live-certification"
    scope: "future_writes"
    description: "AmneziaWG/RCI write semantics, Safe Configuration и rollback должны быть подтверждены на выделенном Netcraze Ultra NC-1812."
    resolution_gate: "Gate B write certification per capability family; Gates C/D laboratory/production windows."
  - id: "firmware-capability-matrix"
    scope: "future_writes"
    description: "Write boundary для exact firmware/build/channel/component tuple NC-1812 остаётся fail-closed до Gate B."
    resolution_gate: "Gate A read identity resolved (2026-07-21); write certification requires Gate B on exact tuple."

