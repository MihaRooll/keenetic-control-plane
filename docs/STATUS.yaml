  night_3_status_2026_08_05: "**THE VPN MODULE NOW ACTUALLY WORKS END TO END — first real WireGuard handshake in the project's history, achieved and reproduced live by Main on 192.168.2.1; the previously BLOCKED T3 allowlist item from `night_2_status_2026_08_05` is RESOLVED and its consequences fully exploited.** Full narrative, evidence and exact citations in `.cursor/plans/main-decisions-local-hub.md` §M-24, §M-25, §M-26 — read those three first, this is a summary. **(1) Root cause of the project's long-standing 'no handshake' mystery found and proven — it was never firmware, never the provider, never the missing interface address.** `PersistentKeepalive` was silently discarded on the profile path: `router_control/adapters/netcraze/awg_profile.py` accepted the key in `ALLOWED_PEER_KEYS` but `ParsedAwgProfile` had no field for its value; `routes.py::_profile_metadata_from_parsed` never stored it; `routes.py::_wireguard_intent_from_profile_row` never passed it — while the domain intent (validated 3..3600), planner, RCI builder and client allowlist had all supported `keepalive-interval` for months. Every profile activation in the project's history therefore configured a peer with no keepalive, so WireGuard had no trigger to initiate and `peer_txbytes` stayed 0 forever. Proven by changing exactly one variable: same profile, same interface, no keepalive → `txbytes: 0`, `tunnel_never_handshaked`; with `peer_keepalive_interval=25` → handshake in ~1 second (`tunnel_healthy`, `peer_rxbytes: 92`, `peer_txbytes: 331`, `peer_online: true`, sustained 13+ minutes with growing counters). **(2) `wireguard_ip_global` accepted by the device live for the first time** (`ok:true`, ident `Network::Interface::L3Base`) — the single prior attempt (2026-08-04T20:02:02Z) had failed with `service.op_dispatch_failed` from the very same allowlist gap as `ip address`, and nobody retried it after the §M-23 fix. Two controlled experiments then proved keepalive is necessary AND sufficient to make the router emit handshake traffic with or without `ip global`; `security-level: public` is set by the device itself regardless of `ip global`, so no new RCI grammar is needed for it. **(3) A blocker that made the module unusable with the operator's real files, hidden by a script workaround:** the product importer rejected the completely standard dual-stack `AllowedIPs = 0.0.0.0/0, ::/0` with `422 profile.validation_failed` — and **all 21** real `.conf` files the operator supplied (two paid providers) carry exactly that value, so nothing could be imported through the UI at all. It looked green only because a previous session's Main-only helper `scripts/main-import-activate-vpn-20260804.py:36-59` silently regex-stripped the IPv6 entry before importing; that workaround was never productised. Now fixed honestly: the IPv4 entries drive the device, the IPv6 entry is reported via the existing `unsupported_fields_json` plus a plain-Russian operator note, an IPv6-only value still fails closed, and the device grammar/allowlist stay IPv4-only. Main re-verified on the operator's actual files: **accepted 21, rejected 0** (was 0 of 21). **(4) A working tunnel was being reported to the operator as 'not verified':** `_never_handshake_sentinel_status` deliberately (and correctly) treats `last-handshake = 0` as unconfirmed, but `_observe_tunnel_with_optional_recheck` ran its bounded settle+recheck only for `tunnel_never_handshaked`, so the ambiguous-zero reading never got the one recheck that resolves it. Fixed without redefining zero and without inventing evidence — if the recheck is still ambiguous the verdict stays `tunnel_unverified`. **(5) Operator's headline UI directive addressed:** the literal 'перезагружается' was real — `app.js` called `window.location.reload()` unconditionally on service-worker `controllerchange` while `sw.js` did `skipWaiting()`+`clients.claim()`, so any code change silently hard-reloaded the operator's tab mid-operation; now a dismissible in-app 'update available' notice reloads only on an explicit click, first install stays silent. Plus: screen enter animation, a global in-flight request progress bar, toast/modal/badge motion, a reusable `createProgressPanel`, precache completed and `CACHE_VERSION` bumped to 26; and on the VPN screen the catalog no longer blanks to a skeleton on refetch (skeleton only on genuine first load), full `clearElement(contentWrap)` rebuilds are replaced by targeted slot updates that preserve scroll and focus, and observe/validate/activate/deactivate/connect/teardown all show honest phase progress instead of freezing for 20-70s. **(6) Cross-package regression caught by Main's own sweep, worth remembering as a delegation lesson:** the shell package ran `tests/test_hub_module_bindings.py` (which the VPN-screen package never ran) and found `screens/vpn.js` crashing on render — `mainCol.insertBefore is not a function`. The product code was correct; the gap was in the test DOM shim `tests/support/hub_module_guard.mjs`, which polyfilled `prepend`/`contains`/`hasChildNodes` but not `insertBefore`. Fixing it also closed two identical latent gaps (`replaceWith` used by `screens/domain.js:1315`, `insertAdjacentElement` by `screens/overview.js:753`). **Final live proof, no workarounds anywhere:** unmodified `Keenet_Roll (3).conf` → `import 201` with the honest IPv6 note → `metadata.peer_keepalive_interval = 25` → `activate 200` → `tunnel_verification_status: \"tunnel_healthy\"`, `link: up`, `rxbytes: 92`, `last-handshake: 25`, and an independent `show interface` read confirming exactly one WG interface left up (switching profiles releases the previous interface by itself, which is the promoter-switching behaviour the operator asked for). Cross-package sweep: **489 targeted tests passed**. **Still honestly open:** browser-level visual acceptance of the animations was NOT possible (no browser automation available in this environment) — the operator must look at `http://127.0.0.1:8787/settings/router-control/hub` themselves; the `rockblack` FI profile still gets no reply from its provider (provider-side, not our bug — do not invent a cause); routing policy through the tunnel (default route / priority / kill-switch) was deliberately not touched; the hub does not yet surface `operator_notes`/`unsupported_fields` from import; guest reachability of entry pages still needs a real phone; the three `rockblack-awg2-fi*` AWG 2.x files remain unsupported for apply under the existing T4 gate. **Repository hygiene finding the operator must decide on:** only 122 files are tracked in git, HEAD is still at 'Phase 1 offline mega', and essentially the whole project since then is uncommitted — 1079 untracked files and 62 modified, including the entire `router_control_host/web/` tree; plus dozens of `_adv_*.txt` scratch files and one file with a broken name from a subagent's malformed PowerShell quoting sit in the repo root. Nothing was committed or pushed this session. Gate A evidence unchanged and still fresh (`gate-a-probe-main-verify-20260804-2242.json`, valid to 2026-08-05T19:45:10Z). Gates B/C/D unchanged; WriteCertified NOT claimed; `write_shapes_registered` remains false."
