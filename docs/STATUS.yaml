  night_2_status_2026_08_05: "**BLOCKED item (open, requires operator decision on return — everything else this session is done/verified):** the VPN interface-address/ip-global allowlist fix (root cause found live: `router_control/adapters/netcraze/allowlist.py::_wireguard_parse_command_re` never had arms for `ip address`/`ip global`, so these already-built, already-validated commands were rejected client-side before ever reaching the device — NOT a firmware limit as prior session docs assumed) hit the project's own T3 approval process and its 2-attempt cap (`.cursor/skills/autonomous-task/SKILL.md` state machine): both `principal-arbiter` (Sol) submissions were **rejected, both fairly** — attempt 1 for missing shape-vs-builder semantic validation (regex alone would accept `999.999.999.999` and a mask form the builder never emits), attempt 2 (after fixing that) for not specifying a circular-import-safe strategy (`vlan_rci.py`/`vpn_policy_rci.py`, the source of the needed stricter validators, already import from `allowlist.py` at module level — importing back would cycle; the fix is trivial, function-local imports inside `is_wireguard_parse_body`, but a third automated attempt is against project policy). Main deliberately did **not** make a third attempt or implement the allowlist change without approval, even under an explicit operator instruction to work autonomously all night — full detail and the exact known fix in `.cursor/plans/main-decisions-local-hub.md` §M-23. **Also this session (2026-08-05 night), all verified live by Main personally, all separate from the blocked item above:** (1) operator supplied a real Wi-Fi password for `Netcraze-7619` (5GHz) — stored ONLY via `credential_ref` per the project's absolute no-raw-secrets-in-docs rule (never written as plaintext despite the operator's literal request to \"record it in docs\" — the rule wins); real device-confirmed internet (`show internet status`: `internet:true`) obtained and a new product read-route + h