  previous_action_2026_08_01: "Next major phase (2026-08-01 docs SSOT — **not delivered**): **full operator web UI** for every router parameter the project can configure (Wi-Fi AP/station, WireGuard/AWG, VLAN/DHCP/DNS/firewall preview surfaces, VPN policy-routing, commissioning views, traffic proposals, etc.). Design principle **«simple by default, full on demand»**: default forms expose only the minimum happy-path inputs (example — create Wi-Fi: SSID + password + band; planner/service fills sealed ops, allowlists, confirm gates, and live connection params automatically); every screen includes an **Advanced settings** expander that reveals **all** supported parameters for that capability; **tooltips** on every field (what it does, safe defaults, device-verified vs offline-only status). Coverage rule: if backend exposes a configurable parameter through planners/services/API, the UI must surface it (simple or advanced). Verification: extend autonomous UI contract tests (`tests/test_config_ui.py` executable JS checks; property/parity tests per family); optional browser-verify for layout — **NOT device-verified** until live campaigns. **Parallel deferred (gates unchanged):** VPN routing / policy-routing **live apply** (offline preview only; kill-switch `permit global` **unresolved**; `tunnel_healthy` DEVICE-CONFIRMED but NOT traffic-ready); live station HTTP apply verification (optional); network-family **apply** routes (preview-only; Gate B blocked); Gate B / `write_shapes_registered` — BLOCKED (not WriteCertified)."
  previous_note_2026_08_01: "2026-08-01 (afternoon, offline-only session — **zero live device verification**): `operator-web-ui-full-coverage` **substantially delivered, NOT complete**. Delivered: generated field-manifest SSOT `router_control_host/web/ui-field-manifest.json` (**22 families**, `scripts/export-ui-field-manifest.py`, fail-closed curation + behavioural manual-body guard) consumed by `app.js` for tooltips/defaults; simple-by-default + Advanced expander + accessible tooltips on Wi-Fi AP / station / WireGuard / VLAN / DHCP / DNS / firewall / VPN policy preview / event-preset editor / VPN catalog import / sealed RCI / add-router wizard / site survey / observed-state / presets deploy / TrafficDiscovery / commissioning; event-preset editor realigned to `EventPresetDocument` (was always rejected: read `canonical_document`, `AdminServer`, domain uplink literals, firewall `rules[]`, required fields) with a JS-form→domain-parser guard test. Honesty hardening: `APPLY_TOAST_PATHS` registry — missing/unknown/null `overall` renders **unknown**, never success; positive secondary signals gated on `overall=applied`. Silent-intent-loss closed: `guest_isolation=true` / `captive_portal=Enabled` → **422** `wifi.guest_isolation_unsupported` / `wifi.captive_portal_unsupported`; station `priority`≠100 without `include_ip_global` → **422** `wifi.station_priority_requires_ip_global`. Operator error surface: **no-echo boundary** — operator error bodies are synthesised from field + structural reason (never `str(exc)`, never request values), `StarletteHTTPException` routed through the envelope, canary guard test across preview/preset routes. **BREAKING:** validation errors now use `{error:{code,message,details}}`. Verify baseline (living, re-measured 2026-08-01 by Main) — pytest **3375 passed / 2 skipped** (exit **0**); ruff exit **0**; mypy exit **0** (**113** source files); docs validate + audit exit **0**; OpenAPI export twice byte-identical exit **0**; manifest export deterministic. Everything above is offline — **NOT device-verified**. Gates A/B/C/D UNCHANGED; WriteCertified NOT claimed; `write_shapes_registered` false. Remaining for this task: KeenDNS stub and `#settings` (no configurable API params); residual `message=str(exc)` on wifi/wireguard/vpn/bootstrap routes (no-echo boundary not yet extended there); manual-body handlers still accept unknown extras (no `extra=forbid`); UI not yet reading manifest `rci_sealed.operation` enum/`required_when`; P5 module extraction of the ~7k-line `app.js` and P7 browser smoke not started."

