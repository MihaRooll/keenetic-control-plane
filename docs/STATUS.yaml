ion survives (DPAPI vault + SQLite are disk-persisted, confirmed again) and the button renders. **Operator's closing directives for the next chat, verbatim intent:** stop treating the ~4.4k pytest suite as the acceptance signal — local tests only, and the full suite only once at the very end if truly needed, not per iteration; the module must auto-connect on its own; if there is no internet it must proactively offer to connect one; every screen must be so simple that the least technical event promoter never gets lost and can configure what is needed; the orchestrator for the new chat is Claude Sonnet 5, but every subagent — including any L1 orchestrator role — must be Composer 2.5 or Grok 4.5, never Sonnet/Claude below Main; and the new chat must run fully autonomously because the operator is leaving. Living paste block for the new chat: `docs/NEW_CHAT_ORCHESTRATOR_PROMPT_2026-08-04.md`. Verify baseline at end of this session (Main, targeted — not a full run, per the operator's own new testing directive stated mid-session): `tests/test_hub_uplink_wifi.py` 18 passed; `tests/test_hub_staff_wifi.py`+`tests/test_hub_guest_wifi.py` 134 passed; one full `pytest` run was still taken as a one-time checkpoint before the directive fully landed — **4463 passed, 2 skipped, 0 failed**, exit 0; ruff 0; mypy not re-run this session (no Python touched). Nothing committed or pushed. Gates A/B/C/D unchanged; WriteCertified NOT claimed; `write_shapes_registered` remains false."
  previous_action_2026_08_04_night: "**(0, main priority) LOCAL HUB — all eight screens exist and connection plus Wi-Fi are device-proven; what remains needs a human decision or physical hardware.** Operator's acceptance bar is unchanged: «мне нужен реально работающий модуль, а не демо. Реальное подключение, реальные статусы, реальный Wi-Fi и VPN» — acceptance is live behaviour on the real expendable lab router 192.168.2.1, never green tests and never fake-mode screens. **Device-proven by Main personally (2026-08-03 night → 2026-08-04 morning; full evidence in `.cursor/plans/main-decisions-local-hub.md` §M-11…M-17):** defects **L-1, L-2, L-3 closed**; connection restore binds to the genuinely enrolled `rtr_f17a7d35…` (port 22, source 192.168.2.10, `cred_69280efb…`) and outranks a pin-bearing `live_ready` junk draft that Main created deliberately as the adversarial case; the learn→confirm ceremony through the UI pins the enrolled record, after which a **brand-new tab** reads real Wi-Fi with no ceremony and no 422; **Wi-Fi apply works on the device through the UI** — `PUT credentials` → `wifi/preview` → `wifi/apply`, plaintext PSK only in the credential call, the device itself confirming `RC-Lab-AP3-WPA2`/`WPA2`, `RC-Lab-AP3-WPA3`/`WPA3`, `RC-Lab-AP3-MIXED`/`WPA2_WPA3_MIXED` on staff Wi-Fi and `RC-Lab-Guest-AP4-WPA2`/`WPA2` on guest Wi-Fi, **no silent WPA3→WPA2 downgrade** (decision M-1 proven on hardware), clean teardown to `not_configured` every time, production `AccessPoint0` verified untouched; the apply verdict on the acting tab is now trustworthy in **both** directions after a bounded readback poll (2 s interval, 25 s timeout, cancellable, interim «Проверяем изменения на роутере») replaced a single early read that had falsely reported failure on a successful apply. **Next, in order:** (a) **live VPN is the one acceptance criterion with no evidence path today** — the M-9 rule «handshake present + peer online + non-zero inbound traffic» needs a real remote peer, which the lab does not have; either obtain a real peer/provider config (human decision; credentials via `credential_ref` only) or record the criterion as honestly unreachable — a tunnel reporting `status: up` must never be presented as a working VPN; (b) prove the «Страницы входа» guest path end to end — needs the separate public listener (`scripts/run-public-entry-zone.ps1`) on a LAN address, a firewall rule (the product prints it, never applies it), and a phone on the guest network; until a guest device fetches `/p/{slug}`, «страница доступна гостю» stays honestly unknown and the UI must keep saying so; (c) verify on a real iPad — layout, VoiceOver behaviour for the indeterminate Wi-Fi switch (`role=\"checkbox\"` + `aria-checked=\"mixed\"` + disabled), and PWA install; this UI has never been opened on real hardware; (d) harden the test suite against process-global patching: `tests/test_host_probes.py` patches `HTTPConnection` through `host_probes.http.client`, which **is** the stdlib module object, so the patch is process-global and can hand a `MagicMock` to any test that speaks real HTTP — one such test was already broken by it and had to be moved into a subprocess driver; patch through a private alias instead; (e) close the remaining small items below. **Small open items (none blocking):** `POST /wifi/observed-state` with `router_id` still demands `router_credential_ref_id` from the client although host/source/pin/username resolve server-side and `live_ready: true` is promised — either resolve the credential too or stop promising readiness; the server still accepts duplicate roles and colliding machine field names that the client rejects; a modal stack is still possible if the session expires mid-run; guest form submissions are validated and accepted but deliberately not stored, so «регистрация» keeps no list. **Known state of the store:** a reviewer's fake host started without an explicit `db_path` migrated the real `data/router_control.sqlite3` from schema 12 to 13 and left one row in `entry_pages`; the migration is additive, there is no downgrade, live behaviour was re-verified afterwards, and every agent must now pass an explicit temporary `db_path`. **Delegation model unchanged:** Main orchestrates and never writes product code; one `operational-orchestrator` on `claude-opus-5-thinking-high` per package with **at most 3 L2 agents at a time** (operator's IDE limit) and Claude forbidden for L2; `explore`/`adversarial-reviewer` on `cursor-grok-4.5-high-fast`, `implementer`/`verifier` on `composer-2.5-fast`; nesting strictly Main→L1→L2; live router work is Main's alone and forbidden to subagents; full pytest once per stage, and compare failures by **name** — a targeted run proves nothing about the full suite. **Gate A freshness:** pointer `data/artifacts/gate-a-probe-main-verify-20260803.json` expires 2026-08-04T18:35:45Z UTC and blocks all live tooling until a pointer-only recertification is done (evidence-driven, not a human gate, and not a rebind). Gate B / `write_shapes_registered` remain BLOCKED; WriteCertified NOT claimed; KeenDNS cloud publishing stays a human gate."
  previous_note_2026_08_04_night: "2026-08-03 night → 2026-08-04 morning (autonomous overnight session, Main = Sol orchestrator, all implementation delegated) — **LOCAL HUB reached eight screens out of eight and stopped being a demo: the module reads and writes the real router through its own UI, and the apply verdict on screen is now trustworthy in both directions.** Five orchestrated packages plus targeted implementer runs, all under the operator's constraints: at most 3 L2 agents at a time, Claude only at orchestrator level, `explore`/`adversarial-reviewer` on Grok and `implementer`/`verifier` on Composer, Main writing no product code and verifying every claim personally on the live device. **Device-proven this session (evidence in `.cursor/plans/main-decisions-local-hub.md` §M-11…M-17):** L-1, L-2 and the newly found L-3 closed; restore binds to the genuinely enrolled router and beats a deliberately-created `live_ready` junk draft; the host-key ceremony through the UI pins the enrolled record so a brand-new tab reads live Wi-Fi with no ceremony and no 422; Wi-Fi apply works end to end on hardware with the **device itself** confirming SSID and WPA mode for WPA2, WPA3 and WPA2+WPA3 mixed on staff Wi-Fi (AccessPoint3) and WPA2 on guest Wi-Fi (AccessPoint4) — no silent WPA3→WPA2 downgrade, clean teardown to `not_configured` every time, production `AccessPoint0` untouched; screens «Страницы входа» and «Диагностика» implemented and then verified live, so all eight screens render with zero console errors, «Диагностика» reuses the single readiness truth and leaves the router-side «Интернет» row honestly unavailable even when the host-side internet check succeeds, and «Домен» left IMPLEMENTED_UNVERIFIED with honest «Адрес не задан» / «Не проверено» copy. **Defects found only because Main ran the real device, never by tests:** a username save button that could never be clicked; a runtime regression that broke both Wi-Fi screens because an `import` was overwritten rather than extended (it passed targeted tests *and* `node --check`, and is now guarded by a harness that imports every hub module and mounts every screen); a fail-closed bypass letting a client pin the live SSH dial to an arbitrary fingerprint by omitting `router_id`; silent unbound SSH when the stored `source_address` was NULL; a badge reading «Отпечаток не совпадает» while the facts on the same screen read «Неизвестно»; an overview card still claiming the entry-pages section was unavailable after it shipped; «Диагностика» rendering its title without an `h1`; «Домен» showing a not-yet-run probe in a warning tone; and — most instructive — a **false negative** after a successful apply: the readback fired once, raced the 20-30 s hardware settle window, and told the operator «Проверка не совпала» plus «на роутере пароль не сменился», a cause the system cannot observe at all because the PSK is not readable (`key_configured: null`). That is now a bounded poll (2 s interval, 25 s timeout, cancellable) with an interim «Проверяем изменения на роутере», and the negative wording lists the fields actually compared and states plainly that the Wi-Fi password cannot be read back, so it is neither confirmed nor refuted; re-verified on hardware, where the acting tab shows «Сохранено и проверено» / «Роутер принял настройки, сеть готова к подключению». **Honest limits:** live VPN was never raised — the «handshake + peer online + non-zero inbound» rule needs a real remote peer the lab does not have, and a tunnel reporting `status: up` is not a working VPN; guest reachability of entry pages is unproven and deliberately shown as unknown until a guest device fetches `/p/{slug}` through a separate public listener plus a firewall rule; nothing has ever been opened on a real iPad. **Store side effect to know about:** a reviewer's fake host without an explicit `db_path` migrated the real `data/router_control.sqlite3` from schema 12 to 13 and left one `entry_pages` row; additive, no downgrade, live behaviour re-verified afterwards, and an explicit temporary `db_path` is now mandatory for agents. **Verify baseline (Main, end of session, own full run):** pytest **4443 passed, 2 skipped, 0 failed** (exit 0); ruff 0; mypy 0 (158 files, both packages); docs validate + audit 0; `node --check` 0; exports byte-identical across runs (`openapi A4F90319…`, `manifest 7F707AB3…`). The two time-bound I-21 tests currently pass because the Gate A pointer is still fresh and will fail again after 2026-08-04T18:35:45Z — not a regression. **Method lessons recorded (L-21…L-23):** a parse check proves parsing, not resolvable bindings; confirmation dialogs render outside `<main>` and a repeat `goto` to the same URL with a fragment does not reload the document, which twice made Main briefly mistake an open modal for a hung screen until a screenshot refuted it; and a targeted pytest run proves nothing about the full suite — an ordering-dependent failure appeared only in the full run because `tests/test_host_probes.py` patches `HTTPConnection` through `host_probes.http.client`, which **is** the stdlib module object, so the patch is process-global and can hand a `MagicMock` to any test doing real HTTP. Gates A/B/C/D unchanged; WriteCertified NOT claimed; `write_shapes_registered` remains false; nothing committed or pushed."
