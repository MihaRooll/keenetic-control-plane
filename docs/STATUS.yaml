  day_5_final_2026_08_05: "**End of the 2026-08-05 session — one-tap VPN egress proven live, and the full test suite is green for the first time since the day's landings. Detail in `.cursor/plans/main-decisions-local-hub.md` §M-36..§M-39.** **(1) Routing policy: decided NOT to build.** A dedicated plan asked first whether named connection policies were needed at all and the honest answer was no: a winning `ip global` priority already moves the default route onto the tunnel and back, and the operator never asked for staff-versus-guest differentiation. The vendor kill-switch pattern is rejected by this firmware, so no protection on tunnel drop was promised — traffic can leak to the normal uplink and only visible status plus a fast manual switch mitigate it. Named policies, segment binding and kill-switch stay closed (§M-36). **(2) A real gap in the headline feature was found and fixed:** the one-tap VPN tile connected the tunnel but never sent a priority, so traffic did not actually route through it. Stage A now sends a winning priority and — critically, after an adversarial finding — persists it in profile metadata, without which the auto-reconnect watchdog would drop the routing on the first reconnect. Main proved it live: eight operations all acknowledged, `tunnel_healthy`, default route on `Wireguard9` with `defaultgw: true` and `priority: 900`, counters growing, metadata carrying `ip_global_priority: 900`, `peer_keepalive_interval: 25`, `tcp_mss_pmtu: true`; full teardown accepted including `clear_ip_global` and `clear_tcp_mss` (§M-38). **The 900 value is topology-dependent, not universal** — it wins against this bench's station at 600 and wired ISP at 700, and that caveat is documented in the code and shown on screen. **(3) Documentation and the new-chat prompt were rebuilt in multiple verification passes** as the operator required: living docs across three passes, `AGENTS.md` and root `README.md` synchronised, the prompt rewritten and checked by a fact-check pass and a cold-reader pass. **(4) Main found and removed its own rule violation:** the host admin password was a literal in sixteen operator scripts; all now read `HUB_ADMIN_PASSWORD` from the environment and fail closed without it, and a repository-wide search for the literal returns nothing (§M-37). **(5) The full suite was run once as the final gate and caught 41 failures that no targeted run saw** — a stale generated field manifest and pinned OpenAPI snapshot, two authorisation-bypass tests that were failing *before* reaching their assertion so the protection was not being checked at all, a leak test blocked the same way, and six order-dependent tests whose cause was a string-path monkeypatch broken by a module reload elsewhere in the suite. All fixed with **no production change and no weakened assertion**; Gate A test pins were updated only after confirming `docs/gate-a-certification.json` and `gates.A` agree, and neither file was modified. **Final state: `4896 passed, 2 skipped, 0 failed`** (§M-39). **Still honestly open:** visual browser acceptance of the interface (no browser automation in this environment — operator must look); the Wi-Fi auto-reconnect watchdog after a real drop is NOT live-proven; the `rockblack` provider profile still receives no reply; MSS clamping is NOT proven to fix the captive check; guest reachability of entry pages needs real hardware; WriteCertified NOT claimed and `write_shapes_registered` stays false; gates B/C/D unchanged. Git untouched by operator instruction."
  evening_5_browser_2026_08_05: "**The interface was looked at with eyes for the first time in this project, and it changed the picture. Detail in `.cursor/plans/main-decisions-local-hub.md` §M-41, §M-42, §M-43.** **(1) A browser finally works for the agent.** The operator installed browser MCP; the `browse` server is broken (`ENOENT` on its own binary, empty `node_modules/.bin`), `browser-use` worked only after launching a SEPARATE Chrome with `--remote-debugging-port=9222` and its own profile, because the operator's running Chrome had no debug port and the daemon died with an empty log. Cursor's native `cursor-ide-browser` became available later and is the better surface. The operator granted two standing permissions: the agent may type the password on `127.0.0.1:8787` only, and browser actions may auto-run. **(2) The headline finding: `4896 passing tests coexisted with a visibly broken main menu.`** A whole family of CSS classes emitted by `overview.js` (`hub-overview__vpn`, `__internet`, `__networks`, `__domain`, `__connection-banner`, `__secondary-nav*`, `__quiet-link`, `__username-*`) plus every `hub-vpn__tile*` class had **no rule in any stylesheet** — verified twice, by `rg` over the repo and by enumerating `document.styleSheets` on the live page. The VPN block therefore escaped the card column as bare full-width text and profiles rendered as a vertical stack instead of the compact grid R-7 asks for. Contract tests check that data arrives; nothing checked that a human can see it. **(3) A 500 that broke the operator's main menu, caused by Main's own earlier repair.** `GET /standing-network-preferences` failed on every call (`NotFoundError: standing network preferences row missing`) because `scripts/main-repair-schema-v14-20260805.py` had recreated the table without re-seeding the migration-14 singleton. Row restored via `scripts/main-seed-standing-prefs-20260805.py`; the product now also self-heals — and Main proved it by **deleting the row on the running hos