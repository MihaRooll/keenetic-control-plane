  discovery_diagnosis_wifi_picker_and_second_gate_a_recert_20260802: "2026-08-02 (late evening, continued session) — Four threads, each closed with an operational-orchestrator cycle + adversarial-review pass and personally re-verified by Main afterward, but via DIFFERENT methods — do not blur them: (1) discovery diagnosis verified via real browser click-throughs against the REAL live router 192.168.2.1; (2) Gate A recert verified via a pinned SSH probe against the REAL live router (read-only); (3) the new Wi-Fi picker feature and its two follow-up fix rounds were verified via real browser click-throughs but in FAKE MODE ONLY — zero live router reads or writes for the picker work. (1) **'Автообнаружение как будто не работает' investigated, NOT reproduced as a functional failure**: Main restarted the orphaned live host (old process outlived its tracking terminal, silently still serving on 8787) and reproduced the exact Step-1 → Advanced → Автообнаружение flow twice via Cursor IDE browser (not curl) against 192.168.2.1 — both times returned 5 correct candidates including the `local_subnet_gateway` match in ~3.5s and rendered the picker correctly. Root-caused the most plausible explanation instead: `host_route_table.py`'s `WindowsHostRouteTable` decoded PowerShell stdout with strict UTF-8 and no BOM-stripping, so a leading `\\ufeff` (locale/PowerShell-version dependent, would not reproduce on Main's own machine) or any `UnicodeDecodeError` silently produced an empty candidate list with HTTP 200 and zero operator-visible error — exactly indistinguishable from 'nothing happened'. Fixed: `_strip_utf8_bom`, `UnicodeDecodeError` now caught alongside `OSError`/`TimeoutExpired`, per-source `source_diagnostics`/`degraded_sources` additive response fields distinguishing `ok`/`empty`/`failed` (with structural `reason_code`, never raw stdout/exception text — confirmed by adversarial review), UI now shows 'Не удалось прочитать локальные маршруты…' instead of silent omission; `prefix_length<=0` interfaces no longer emit a garbage `0.0.0.1` candidate; whitespace-only `source_address` from a candidate no longer overwrites manual input; 'Автообнаружение' button now shows 'Автообнаружение…' during the ~3.5s round-trip with guaranteed `finally`-block revert. A related bug found independently by adversarial review — a FAILED internal `default_gateway` fetch used only for dedup could silently produce a false-positive `local_subnet_gateway` candidate with zero diagnostic even when `include_default_gateway=false` — was also fixed (fail-closed candidate suppression + surfaced diagnostic) and the test that had locked in the old broken behaviour was corrected, not deleted. (2) **Second Gate A freshness recertification** (tuple unchanged byte-for-byte, drifted_fields=0, NOT a rebind, same pattern as 2026-08-01): the 2026-08-01 evidence pointer was approaching its 24h deadline (2026-08-02T21:28:28Z UTC); Main used the already-captured matching probe from earlier the same evening (`data/artifacts/gate-a-probe-main-verify-20260802.json`, recorded 2026-08-02T14:52:27Z) as the new SSOT evidence pointer in `docs/gate-a-certification.json` + `STATUS.yaml` (five-level `previous_evidence`/`prior_evidence` chain preserved), corrected two stale narrative doc cross-references in `DEDICATED_ROUTER_LAB_POLICY.md` and `README.md` that still named the 2026-07-31 handoff/evidence as 'current', and re-pinned `tests/test_gate_a_certification.py` to the new constants (24 tests green). (3) **New feature per user request: phone-like Wi-Fi network picker in simple Step 3** ('Интернет (Wi-Fi uplink роутера)'), reusing the EXISTING live-device-verified (2026-07-31) `POST /wifi/site-survey` scan capability and the EXISTING expert `#uplink` panel's scan→select→enroll→apply pattern — no new CLI/RCI grammar invented. Scan is now the PRIMARY interaction (prominent button, not buried under `<details>`, unlike router auto-discovery which stays secondary by design); clicking a scanned network fills SSID+band and offers a password-enroll step (`PUT /routers/{id}/credentials` `kind:\"WifiWanPsk\"`) wired into the existing `/wifi/station/preview|apply`; manual SSID entry kept as a secondary fallback; honest tri-state scan status (found / partial-per-radio-failure / empty / insufficient-live-params / failed) — never silently shows a false success or a false 'nothing found'. **Main's OWN live browser click-through (not the delivering cycle's automated tests) found the feature was broken end-to-end**: after actually completing Step 1 with a real/fake enrolled router, 'Найти сети' always 422'd with `wifi.live_connection_incomplete`, because the simple wizard never carried `host`/`username`/`router_credential_ref_id` forward from Step 1 into Step 3's live calls — a pre-existing gap in Step 3's Предпросмотр/Подключить buttons too (not introduced tonight, just newly exposed), consistent with STATUS's long-standing 'station HTTP apply delivered, NOT device-verified live' note; nobody had apparently ever clicked through the simple wizard's own Step 3 against a really-enrolled router before. Fixed: `host`/`username`/`router_credential_ref_id` now carry forward automatically from Step 1's in-session state (NOT persisted across a full remount without re-connecting — a documented residual gap); `ssh_host_key_sha256` still requires Step 2 Advanced manual entry (documented, not silently worked around — see next_task item 2 above); when live params are genuinely incomplete, scan now correctly omits the useless bare `router_id` and falls back to a plain fixture/offline call instead of guaranteeing a 422. Adversarial review then found two more real should-fix issues, both fixed and re-verified afterward by Main via the SAME fake-mode/offline browser click-through method (NOT against the real router — no live device write or read was involved in any of the picker fix/verify rounds): re-scanning left stale SSID/band/credential_ref-id in the form after a prior selection (now cleared at scan-start, band resets to default); a manual-field edit could silently lift the open-network safety block even with a no-op focus/blur or the SAME open SSID still sitting in the field (now requires the SSID to actually change before re-enabling apply). Known, disclosed residual gaps: WPA3-labelled scan results still submit `wpa2_psk` grammar (planner only supports wpa2_psk|open) — see next_task item 3; Step 5 guest Wi-Fi likely has the identical live-params carry-forward gap, not investigated. Verify (Main, repeated after every cycle and every fix round, final count): pytest **3529 passed / 2 skipped / 2 failed** (pytest process exit 1 — the 2 failures are the same known pre-existing ones as every prior session this week: `test_connection_health_host_api_yellow_without_probe`, `test_live_create_app_wires_soft_candidate_identity_probe`, unrelated to this session's changes, not in scope, not chased); ruff exit 0; mypy exit 0 (119 files); node --check exit 0; docs validate + audit exit 0; OpenAPI/manifest exports byte-identical across two runs. All Wi-Fi-picker and discovery-fix testing was fake-mode/offline UI work — zero live router mutations. Gates A/B/C/D UNCHANGED (A recertified same tuple only); WriteCertified NOT claimed; `write_shapes_registered` remains false."
