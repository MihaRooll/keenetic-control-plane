h zero ceremony today (M-14), but first-time discovery/enrollment of a brand-new unit still needs a human to run the search→pick→confirm-host-key ceremony; make this as close to zero-touch as the domain honestly allows, and if a step truly cannot be automated (e.g. first-ever host-key trust decision), make it the one obvious button a non-technical promoter cannot miss; (c) **no-internet auto-suggest**: `router-internet` diagnostics row is currently an honest stub (`ROUTER_INTERNET_UNSUPPORTED_MESSAGE` in `diagnostics-model.js`) with no backend read at all — add a real router-side internet-reachability read (the CLI grammar `show internet status` was already used ad-hoc during the 2026-07-31 station campaign; wire it into a product read route) and surface a prominent, plain-language «нет интернета — подключить» call-to-action on Overview/Diagnostics that deep-links straight to `#/internet-uplink` whenever the router itself has no WAN — this is the concrete backend+UI work behind the operator's «module should offer to connect if there's no internet»; (d) promoter-proof pass over **every** screen's copy and flow (not just the two Wi-Fi screens already hardened today with `STAFF_WIFI_SLOT_NUMBER_NOTE`/`GUEST_WIFI_SLOT_NUMBER_NOTE`-style plain language) — assume the operator is gone and the only human touching this is untrained event staff; (e) live VPN remains genuinely unreachable — needs a real remote peer the lab does not have; record as an honest limit, do not fabricate one; (f) «Страницы входа» guest path end-to-end, real iPad verification, and the small open items already listed in `.cursor/plans/main-decisions-local-hub.md` §M-15/M-16 remain open and unchanged. Gate A freshness: pointer `data/artifacts/gate-a-probe-main-verify-20260803.json` expires 2026-08-04T18:35:45Z UTC — check `docs/STATUS.yaml` `gates.A.evidence` for whichever pointer is current when you read this, do not assume this one is still fresh. Gate B / `write_shapes_registered` remain BLOCKED; Wri