  nc1812_false_identity_drift_and_guest_wifi_live_20260802: "2026-08-02 — **Live session on the expendable lab unit.** (1) **False Gate A identity drift traced to our own parser.** The 2026-08-01 probe reported component_set_digest sha256:479a368c… / device_fingerprint sha256:11859ce4… against recorded 23bd35bc… / c34adec4… while host key, firmware, ndm/bsp builds, channel and region all matched. Root cause in `identity.py`: an `installed: \"<version string>\"` marker parsed as an unrecognised boolean (component excluded) while a bare `version` with no `installed` key counted as installed. Measured live: **40** entries carry an installed marker, **54** were counted, **overlap zero** — the digest hashed the vendor catalogue, not the device. An exhaustive single/pair add-remove-swap search failed to reproduce the recorded digest, corroborating the parser explanation. Fixed as `component-set-v2` (MODE A/B); re-probe matched the recorded tuple in **all nine** fields (drifted_fields=0). **No rebind was performed and none was needed.** Lesson L-21 recorded. Artifacts: gate-a-probe-campaign-20260801.json (defective), gate-a-probe-post-parser-fix-20260801.json (sha256 f3dd1c32…), component-inventory-baseline-192.168.2.1-20260801.json, component-install-marker-truth-20260801.json. (2) **Evidence-freshness recertification, tuple unchanged byte-for-byte** — evidence pointer moved to the post-fix probe; prior chain preserved four levels deep; guarded by tests/test_gate_a_certification.py pins. (3) **Live guest Wi-Fi campaign on WifiMaster0/AccessPoint3** within the §1a expendable envelope: pre-change startup-config backup `startup-192.168.2.1-20260802T065555Z-c790ed29.dpapi` before the first write; sealed ops set_ssid → set_wpa_psk → encryption_enable → encryption_wpa2 → up; `overall=applied`; **on_air_verification_status=on_air_verified** with observed ssid `Guest-Lab-Test`, encryption `wpa2`, link `up`, connected `yes`; teardown `overall=applied`; **no `system configuration save`**; throwaway PSK via credential_ref revoked and deleted; production APs AP0/AP1 untouched. Evidence data/artifacts/guest-wifi-live-campaign-20260802.json. **Client isolation was NOT exercised and remains rejected with 422 — no device-verified grammar.** (4) Read-only topology probe re-verified after recertification (32 interfaces, LAN 192.168.2.0/24). Gates A/B/C/D UNCHANGED; WriteCertified NOT claimed; `write_shapes_registered` false."
  operator_simple_mode_and_gate_a_drift_20260801: "2026-08-01 (late afternoon) — **Simple mode** delivered offline + **live read-only Gate A check performed by Main**. UI: consumer-facing `#simple` is now the first screen (mode persisted like theme, expert one click away) with steps connect → link state → VPN → guest Wi-Fi → domain → network families; blocked steps state the reason in plain language instead of offering a button. Backend: `POST /lab/router-discovery` and `POST /lab/connection-health` — bounded read-only, non-certifying, `writes_allowed:false`; discovery sources limited to host default gateway + enrolled endpoints (no CIDR scan, no credential guessing); public and loopback gateways soft-excluded with reason instead of aborting the run; identity is ternary and `known_match` is claimed **only** after a live probe with full tuple match — enrollment+pin agreement without a probe is `unknown` / `enrollment_match_identity_unverified`, incomplete probe evidence is `unknown` / `probe_evidence_incomplete`. Link state green requires status green **and** all five facts (reachable, host_key_match, tuple_match, credentials_present, evidence_fresh); unknown is never rendered as success. Manifest: coverage guard now walks live registered routes, so a new request-body route cannot be added without a manifest entry; families 24 total incl. `router_discovery`, `connection_health`; UI consumes `rci_sealed` contract from the manifest instead of hardcoded maps. **LIVE (read-only, Main): Gate A pinned probe initially reported a tuple mismatch; investigation proved the cause was OUR identity parser, not the device — `component_set_digest` was being computed over the vendor catalogue instead of the installed set (40 entries carry an `installed` marker, 54 were counted, overlap ZERO). Parser fixed (`component-set-v2`); fresh probe matches the recorded tuple in ALL NINE fields (drifted_fields=0). No rebind performed or needed; certified tuple was correct and was NOT modified. Blocker `gate-a-identity-drift-20260801` resolved. Residual: recorded evidence is stale under the 24h rule, so live tooling still fails closed until a human refreshes the evidence pointer (NOT a rebind — tuple unchanged).** Verify by Main: pytest **3432 passed / 2 skipped** exit 0; ruff 0; mypy 0 (**115** files); node --check 0; docs validate + audit 0; OpenAPI and manifest exports deterministic. All feature work is offline and **NOT device-verified**; Gates A/B/C/D UNCHANGED; WriteCertified NOT claimed; `write_shapes_registered` false."
  operator_web_ui_coverage_offline_20260801: "2026-08-01 (afternoon) — Offline-only operator-UI coverage session (**zero live device operations**; no router reachability used, no gate change): five orchestrated cycles with two independent adversarial reviews. (1) UI field manifest as generated SSOT — 22 families, fail-closed curation, nested/union/alias/dict walk, behavioural manual-body key guard; consumed by `app.js` for tooltips and defaults with honest fallback when unavailable. (2) simple-by-default + Advanced + accessible tooltips across all apply and preview families plus wizard/commissioning/jobs/traffic/RCI/survey surfaces. (3) event-preset editor realigned to domain contract; malformed input now HTTP 400, never 500; JS-form→domain-parser guard test added. (4) Honesty: false-success toasts eliminated on every apply path incl. the previously unguarded `#uplink` Own-SSID path; missing/unknown `overall` = unknown. (5) Silent intent loss closed for Wi-Fi `guest_isolation`/`captive_portal` and station `priority` (explicit 422, structural codes). (6) Operator error no-echo boundary: request values can no longer reach error bodies; **BREAKING** validation envelope `{error:{code,message,details}}`. Verify by Main: pytest 3375 passed / 2 skipped exit 0; ruff 0; mypy 0 (113 files); docs validate+audit 0; OpenAPI twice byte-identical; manifest deterministic. **NOT device-verified**; Gates A/B/C/D UNCHANGED; WriteCertified NOT claimed; write_shapes_registered false. Residual: `str(exc)` echo on wifi/wg/vpn/bootstrap routes, manual-body extras, P5/P7 UI phases."
  operator_simple_wizard_and_smart_discovery_live_20260802: "**ERRATA (added later same evening, see `discovery_diagnosis_wifi_picker_and_second_gate_a_recert_20260802` below): the 'pytest ... exit 0' phrase in this frozen entry is imprecise — 2 known pre-existing failures were present then too, so the actual pytest exit code was 1, same as always; and the Gate A evidence pointer mentioned as 'not yet folded into the SSOT evidence pointer' WAS folded in later that same evening (first as the direct post-parser-fix pointer, then superseded again by the second freshness recert) — do not treat either of those two phrases in the text below as current.** 2026-08-02 (evening) — **Simple-mode wizard redesign + smart discovery, WITH live read-only verification by Main on the expendable lab unit.** Four orchestrated cycles, each closed with an independent adversarial-review pass (no blockers found across all four; only should-fix/nit hardening remained open, see below). (1) **`#simple` converted from flat scroll to a wizard**: 7-step horizontal stepper (Подключение/Связь/Интернет/VPN/Гостевая Wi-Fi/Домен/Сети) with pending/current/done state, one step visible at a time (mount+hide, form values persist across navigation), hash routing `#simple/step-N`, Next/Back with correct boundaries; Step 1 minimized to host/username/password only (advanced fields + autodetect tucked under nested `<details>`); new Step 3 'Интернет (Wi-Fi uplink роутера)' wired to the existing `wifi_station` preview/apply endpoints with mandatory confirm-gate, never renders success on weak signals. (2) **Dev-only auth bypass** `RC_UNSAFE_DISABLE_AUTH=1` — request-time ContextVar predicate, armed only when standalone-loopback AND `adapter_mode==fake`; live adapter always ignores the flag (adversarial-proven via concurrent fake/live requests in one process, no bypass leakage); auth code itself not removed. (3) **Smart router discovery**: new `candidate_origin=\"local_subnet_gateway\"` — for each active IPv4 interface WITHOUT a default route, propose exactly one conventional first-host candidate (`network_address+1`, real `ipaddress` arithmetic, not string `.1`); dedup against `default_gateway` candidates now also checks subnet membership, not just exact host/if_index/source match; UI picker shown whenever multiple candidates exist (was previously silent `candidates[0]`); selecting a candidate now also carries `source_address` into the connect and health-check forms (previously lost — this was the exact dual-NIC gap). Cyrillic `route_label`/`InterfaceAlias` mojibake from PowerShell subprocess output fixed via explicit UTF-8 console encoding on both `Get-NetRoute` and the new `Get-NetIPConfiguration` command. **LIVE READ-ONLY VERIFICATION BY MAIN on 192.168.2.1 (wired, source 192.168.2.10):** fresh pinned Gate A probe matched the certified tuple in all nine fields (drifted_fields=0; evidence `data/artifacts/gate-a-probe-main-verify-20260802.json`, recorded 2026-08-02T14:52:27Z — **not yet folded into the SSOT evidence pointer**, current certified pointer still `gate-a-probe-post-parser-fix-20260801.json` recorded 2026-08-01T21:28:28Z, 24h freshness deadline **2026-08-02T21:28:28Z UTC / ~00:28 local 2026-08-03**); router enrolled live via existing `credential_ref cred_69280efb9361ca2911e99d383f0ce474` (no password re-entry) as `router_id rtr_f17a7d35fd3643b9a837d25c15088bfb`, `certification_status=ReadOnlyCertified`, `identity_fingerprint` matched Gate A digest exactly; `POST /lab/connection-health` returned `status=green`, all five facts true; on a genuinely fresh page load with no manual clicks the UI showed 'Подключено: Lab NC-1812 (192.168.2.1)' and green 'Связь есть' automatically; `POST /lab/router-discovery` on the real dual-NIC host correctly produced a `local_subnet_gateway` candidate for `192.168.2.1` via `Ethernet 3` (which has no default gateway) alongside `default_gateway`/`known_endpoint` candidates for the home Wi-Fi and VPN tunnels, UI picker rendered and selection worked. Verify baseline (Main, repeated after each of the four cycles): pytest **3505 passed / 2 skipped** exit 0 (only 2 known pre-existing failures unrelated to this session: `test_connection_health_host_api_yellow_without_probe`, `test_live_create_app_wires_soft_candidate_identity_probe`); ruff 0; mypy 0 (119 files); node --check 0; OpenAPI/manifest exports byte-identical. **UNRESOLVED at handoff: user reported 'Автообнаружение как будто не работает' (autodiscovery seems not to work) immediately after the polish cycle; Main had confirmed the backend/API path live via curl minutes earlier and observed only a likely-benign `ConnectionResetError` in an async transport callback in the uvicorn log (Windows Proactor artifact on client disconnect, not yet correlated to a real discovery failure) — root cause NOT yet found; this is the first thing the next session must reproduce end-to-end in the actual browser the user is using (not just the Cursor Browser MCP session Main used) before doing anything else.** Residual should-fix/nit hardening found by adversarial review but NOT fixed (all confirmed non-blocking, low value relative to effort): auth-bypass warning visible only in stderr/log, not in the UI itself; no CI-locked regression test for the ContextVar concurrency proof; wizard `clampSimpleWizardStep` NaN-guard done, but `-Infinity` not explicitly tested; discovery dedup has no test for non-`/24` prefixes or `include_default_gateway=false` interaction with `bounds.sources`; PowerShell UTF-8 output with a leading BOM silently degrades to an empty candidate list instead of erroring loudly; `subprocess.run(..., encoding=\"utf-8\")` has no `errors=` handler so a genuinely undecodable byte sequence would raise `UnicodeDecodeError` out of `host_route_table.py` instead of failing soft; selecting a discovery candidate with a **whitespace-only** `source_address` overwrites a manually-typed value (empty/`None` correctly preserves it); an interface reported with `prefi