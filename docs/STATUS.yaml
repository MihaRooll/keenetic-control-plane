  day_11_domain_wave2_2026_08_08: "**2026-08-08 — R-8 Domain wave 2 ЖИВЬЁМ on expendable NC-1812.** Operator ask: show automatic CrazeDNS name from the router (not pasted FQDN) + publish personal name. Living SSOT: `docs/OPERATOR_DOMAIN_OVERVIEW_GOAL.md` §1a. Sealed RO: `show acme`/`GET /rci/show/acme` → `default-domain` + `default-domain-certificate-valid` (fixture `tests/fixtures/netcraze/show-acme-default-domain-v1.json`); `show ndns` carries personal book. Shipped: parsers + `POST /keendns/observe` (wifi-style RO session); Hub Overview displays queried default FQDN/SSL; personal publish still `POST /keendns/apply` `mode=auto`. Live fix: cloud book/drop first returns `parse.continued=true` — apply now polls same sealed body up to 20 rounds. Live proof: observe returned automatic `*.netcraze.io` + SSL; apply drop+book booked `rc39d9d0.netcraze.pro` (artifacts `data/artifacts/keendns-*-20260808.json`). Standing template `promo.netcraze.pro` may be taken — UI allows another label. `CACHE_VERSION` 134. R-8 flipped to ЖИВЬЁМ in `OPERATOR_SIMPLE_MAIN_MENU_SPEC.md`. VPN `next_task` id unchanged. WriteCertified NOT claimed; Gates B/C/D closed."
  day_10_evening_status_2026_08_07: "**2026-08-07 evening — the four polished Overview step cards are now ЖИВЬЁМ (pixel-accepted by Main personally), and the closeout uncovered a cache-version trap that the handoff had recorded as already-solved (§M-60).** Previous session had stopped with four items open: unfinished test sweep, `CACHE_VERSION` not bumped, no pixel acceptance of the four cards, nothing written to STATUS/decisions. All four are now closed. (1) **Tests finished green:** `test_hub_vpn.py`+`test_hub_domain.py`+`test_hub_uplink_wifi.py`+`test_ui_host.py`+`test_config_ui.py` → 220 passed exit 0; the four card test files + shared `test_hub_overview.py` + `test_hub_module_bindings.py` → 145 passed exit 0 — moving the VPN logic into exported helpers broke nothing. (2) **`CACHE_VERSION` 50→51, and the reason matters more than the bump.** The file on disk already read `'50'` (not `'49'` as the handoff stated), which invites the conclusion 'step already done'. Live evidence said otherwise: in the browser `caches.keys()` returned exactly one cache, `local-hub-v50`, meaning version 50 had been installed by the client BEFORE Main's post-return defect fixes, so `stale-while-revalidate` kept serving pre-fix copies out of a cache whose number already looked current. A cache-version number only closes the question if it is bumped AFTER the last content change; if content changed after that version was already installed on a client, the version is burned and needs another bump. (3) **Live host restarted** by the standard procedure with the mandatory `UPLINK_WATCHDOG_ENABLED=1` (PID 14156, clean startup log, zero exceptions). (4) **Pixel acceptance done personally** (`data/artifacts/overview-cards-20260807-evening-{top,vpn-domain,domain}.png`): an even row of three cards (1 Роутер / 2 Интернет / 3 VPN) with numbered badge, large framed icon, coloured status badge, framed info block and icon tile grid; the «2 из 4 готовы» segment bar genuinely renders (the §M-59 regression did not return); router card shows «Готово» + «Роутер отвечает»/«Доступ сохранён»/«Устройство совпадает»/«Проверено 19:03»; internet card «Работает» + Wi‑Fi/Кабель/Модем segments (modem honestly muted) + real SSID «Netcraze-7619»/«5 ГГц» + «Интернет доступен»/«Автоподключение включено»; VPN card «Не подключён», four real profiles, honest «Туннель не активен»/«Трафик не проверен» tiles, and live confirmation of Main's CTA fix — «Будет подключён профиль «Keepalive E2E 20260805». Другой — кнопкой на его плитке.»; domain card badge «Не проверено», FQDN `promo.netcraze.pro`, tiles «Имя подготовлено»/«Событие не выбрано». **Methodological trap Main walked into personally and nearly mis-diagnosed:** the FIRST live screenshot showed the domain card with no icon, no badge, bare `promo` and the stale label «Имя домена указано» — i.e. exactly the picture that reads as 'the new card is not wired, old code is live' (by analogy with the real VPN dual-copy defect). Code inspection refuted it (`buildDomainStatusCard` was correctly imported and called) and `fetch('features/overview-card-grid.js', {cache:'reload'})` from the page itself returned a file containing `Не проверено`, `Имя не готово` and `hub-domain-card__icon-frame` — the whole discrepancy was cache, not logic. Rule for future sessions: before declaring a UI defect from a live screenshot, prove the browser is executing current code (compare `caches.keys()` and a `cache:'reload'` fetch against the file on disk); `registration.waiting.postMessage({type:'HUB_SKIP_WAITING'})` plus one reload was NOT enough — it took `unregister()` of all registrations plus `caches.delete()` of all `local-hub-*` before the current code rendered. **Honestly NOT done (left to the operator's taste call, no code changed for it):** the VPN card drives the whole row height (four profiles + tiles + CTA + long explanatory note), leaving visible dead space at the bottom of the router and internet cards; VPN profile tiles in two narrow columns wrap long names onto three lines; the domain card spans full width but its content sits in a narrow centred column and reads sparse; the honest draft-link note is duplicated between the domain card and the «Имя для черновика» block right below it. These are layout/taste issues, not honesty defects. **Runtime-error check plus a second false alarm Main retracted:** an error collector (`window.onerror` + `unhandledrejection` + `console.error` hook) was installed on the live page and a full «Обновить» cycle was triggered — **zero errors**, and the readiness bar re-rendered with real content (4 segments, not an empty container), so the §M-59 class of regression did not return. Main initially believed he had found an inconsistency (router card «Готово» while the bar and bottom strip said router pending), but code inspection showed both read the same `model.router.state`, and a single simultaneous DOM read showed them **consistent** — the earlier comparison mixed two different moments. The real cause of the time-skew: the router health check genuinely flaps — READY at 19:08, `tuple_match` back as `unknown` at 19:13 («Не готово» / «Устройство совпадает: неизвестно»), self-healed back to «Готово» / «2 из 4 готовы» at 19:17 after one «Обновить». That is the known §M-54 concurrent-SSH-session issue, which Main made worse himself: a diagnostic `loadOverview()` call from the console added yet another parallel SSH session on top of the page's own probes. Useful side effect: the flap live-proved the honest three-way label works — the tile said «Устройство совпадает: **неизвестно**» instead of an affirmative text next to a grey icon. A shared SSH lock (the real cure for §M-54) remains T3 and was deliberately not done in passing. Two additional offline Grok orchestrators were dispatched for machine guards against the already-caught defect classes: a sweep of the 'assertive label next to an alarming icon' pattern across all card builders, and guards for non-existent CSS variables (all `--hub-*` checked against `tokens.css`, `--hub-status-*`/`--hub-accent-*` hard-forbidden) plus a static guard against `.className =` on `createElementNS` nodes (the §M-59 trap) — live host, ports 8787/8788 and router 192.168.2.1 explicitly forbidden to both. **Both orchestrators returned and Main personally read their diffs, which turned up one real consequence.** The honest-label sweep (`overview-card-grid.js` + new `tests/test_hub_overview_label_honesty.py`, 13 tests, 2 review cycles, adversarial approve) moved the router tiles onto a three-way form — `reachable` («Роутер отвечает» / «Роутер не отвечает» / «Роутер: неизвестно»), `credentials_present`, `tuple_match` — and gave the entry-pages card an honest «Не проверено» badge (no live probe exists and it previously had no status at all). **Live proof that this fixed a genuine lie rather than styling:** at 19:18, on a page instance still executing pre-sweep JS, a genuinely failed check rendered the tile as «Роутер отвечает» while the banner directly above it said «Нет связи с роутером» — the operator saw two mutually exclusive statements at once; after the sweep, in the same failure state at 19:28, the tile said «Роутер не отвечает», consistent with the banner. Both states were captured live. The guards (`tests/test_hub_css_token_guard.py` + `tests/test_hub_svg_classname_guard.py`, 18 tests) check every `--hub-*` against `tokens.css`, hard-forbid `--hub-status-*`/`--hub-accent-*`, and statically forbid `.className =` on `createElementNS` nodes (the §M-59 trap) — proven to redden on a planted violation and to go green after revert; zero JS violations found, two CSS ones (the non-existent `--hub-font-title-sm`). **What Main found in their work:** swapping `--hub-font-title-sm` for `--hub-font-h2` is correct by the guard but **changed the appearance** — the phantom token made the `font-size` declaration invalid at computed-value time, so the size was **inherited** and actually rendered at 15px; after the swap `getComputedStyle` measured **20px** on all four card titles and on «Состояние системы», an unrequested enlargement in cards the operator had already pixel-accepted. Restored via `implementer` (T0, exactly two lines) to the existing `--hub-font-body` (0.9375rem ≈ 15px) and re-verified live: 15px on all five titles, screenshot matching the accepted state (`data/artifacts/overview-cards-20260807-evening-after-guards.png`). Lesson: a guard that removes a phantom token changes rendering, because the invalid declaration was previously inert — when substituting a token, always measure computed style before and after, not just the green test. **Two more cache traps, recorded because Main again mistook a stale page for a code defect:** purging the service-worker caches is **not enough** — the browser's own HTTP cache kept serving `screens.css` and the ES modules, so it took a `fetch(..., {cache:'reload'})` on the specific files plus a full document load with a cache-busting query; and `buildEntryPagesStatusCard` runs **once at mount** with no re-render path, so a badge added in code physically cannot appear without a full page load, and its absence from the DOM said nothing about the code. The check that settled it in one step: import the module with `?bust=<ts>` and call the builder directly in the console — it returned markup containing the badge, proving the code was right and the page instance was at fault. `CACHE_VERSION` `51→52→53`; full sweep after all changes: **396 passed, exit 0** across 14 test files. Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-60."
  day_10_evening_2_status_2026_08_07: "**2026-08-07 evening, continuation — the Overview VPN card is rebuilt as a compact picker and the bottom row is visually cohesive; the pass also surfaced and fixed three real, pre-existing findings unrelated to tonight's work (§M-61).** Operator's explicit complaint: the VPN card was badly laid out (each profile a full-size block with its own badge and its own 'Подключить' button, ballooning the card's height across 4 profiles) and the row below Domain ('Рабочая сеть'/'Гостевая сеть'/'Страницы входа') looked 'not put together' (entry-pages card nearly empty next to full-size neighbors). Delegated as one T2 contract to `operational-orchestrator` (Grok). **What the agent built (2 review cycles, honestly stopped at scope boundary):** `buildOverviewVpnProfilePicker` — a compact 2×2 selectable tile grid (`<button aria-pressed>` in `role=group`, matching the existing segmented-control pattern in `field.js`) with no per-tile activate/deactivate/remove buttons; `createVpnProfileStatusTileGrid` (the full `#/vpn` screen's management grid) is no longer reused on Overview, `vpn-model.js` untouched. `vpnSelectedProfileId` + `reconcileVpnSelectedProfileId` in `overview.js` — default to active profile else first, reset only if the selected id vanishes from the catalog, survives re-renders. A single CTA connects/disconnects exactly the selected profile with an honest hint naming it. `buildEntryPagesStatusCard` gained an icon-frame + the existing 'Не проверено' badge + a muted caption ('Проверка на этом экране не выполняется') — no new network calls, no invented 'configured' field (the agent verified `overview.js` does not import `entry-pages-model` and explicitly chose the structural-CSS-only variant over fabricating data). **What Main found and fixed after return (read the diff line-by-line, did not trust the Verification Record at face value):** (1) the agent's own honest blocker — two stale tests (`test_hub_overview_vpn_card.py`, `test_hub_overview.py`) asserted old-API strings it was contractually forbidden to touch; Main expanded ownership onto both files and rewrote the assertions onto the new honest API, and additionally removed CSS rules the agent had kept alive purely as 'harmless legacy' to satisfy two now-obsolete CSS tests (`.hub-vpn-card__profiles .hub-vpn__tile-grid`/`.hub-vpn__tile-detail`, dead since Overview never renders those classes anymore) — dead code to keep a test green is the same dishonest workaround pattern the project has flagged before, not repeated here. (2) A false failure across the WHOLE offline contract (`test_hub_no_external_resources`), unrelated to tonight: a naive `http://` substring scanner flagged the standard XML namespace `http://www.w3.org/2000/svg` in `progress-ring.js` (required by `createElementNS`, never fetched over network) as an external resource; `icon.js` had dodged the exact same problem years ago by obfuscating the literal via split template-string parts — fixed honestly this time by teaching the scanner to subtract the namespace URI before scanning schemes, instead of hiding the literal. (3) Five real, pre-existing pill elements missing a `width` constraint (caught by `test_hub_pill_elements_declare_width`, the same guard that once caught a missing `width: fit-content` on `.hub-badge`) — fixed with `width: fit-content` (four simple pills) and `width: 0` (the three-way Wi-Fi/Кабель/Модем equal-split segment, safe since `flex: 1 1 0` already resolves basis to 0). This debt was invisible until tonight because this was the first time this session ran the full `pytest tests/` without `-x` or a file scope. (4) A zombie process on port 8790 (leftover from an earlier subagent, never shut down) was falsely failing `test_hub_staff_wifi_fake_host_apply_readback_on_loopback_port` (a stale process answered '404' instead of the fresh test's own server) — killed by exact PID (port range 8790+ belongs to subagents, not Main, but the zombie was blocking a legitimate test); green afterward. **Live acceptance (port 8787, `CACHE_VERSION` 53→54, both SW and HTTP caches purged before load):** the VPN card is now visibly compact — 2×2 tiles, one button, height comparable to Router/Internet (previously noticeably taller); clicking 'Keenet_Roll (5)' flipped `aria-pressed`, highlighted the tile, and updated the hint to name it — the selection survived both the click and a subsequent 'Обновить'. The bottom row: 'Страницы входа' now has the same visual density as its neighbors (icon-frame, badge, caption) — the 'not put together' complaint is resolved structurally, without inventing a single fact. Zero JS exceptions across a full click+refresh cycle (verified with an `onerror`/`unhandledrejection` collector). **Final broad regression sweep after this whole round: 449 passed, exit 0** across 16 test files (picker + full overview-card family + module_bindings + CSS/SVG guards + label-honesty sweep + vpn/domain/uplink-wifi/ui-host/config-ui); `ruff`/`node --check` clean on every touched file. **Deliberately not touched:** a minor visual nit (`--selected` and `--picked` share the same primary chrome when a tile is not `--active` — the agent flagged it as optional, not a blocker); ~68 pre-existing `ruff` E501 warnings in unrelated test files and one pre-existing `mypy` gap in an unrelated part of `test_hub_frontend_contracts.py` — not this round's regression, not owned by tonight's work, left alone without a separate operator decision. Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-61."
  day_10_evening_3_status_2026_08_07: "**2026-08-07 evening, continuation — full icon audit across the hub, static guard + live verification on 8 screens (§M-62).** Operator asked to confirm every icon renders correctly. `createIcon(name, …)` in `components/icon.js` silently falls back to a grey placeholder circle for any unknown name — no exception, no console error, no visible trace — the same silent-failure class as non-existent CSS tokens (already guarded) and `SVGElement.className` (already guarded), just missing a guard for icon names specifically. Statically grepped every `createIcon('x', …)` and `iconName: 'x'` call site across the whole hub (literals and every dynamic source — `card.js`/`button.js`/`badge.js`/`shell.js`'s sidebar nav from `screen.meta.iconName`) against `ICON_NAMES` — zero typos found across 27 valid names; separately confirmed `core/states.js` owns its own independent 14-icon illustrative system (`ICON_BUILDERS`) unrelated to `ICON_NAMES`, self-consistent. Added a permanent guard, `tests/test_hub_icon_names_guard.py` (4 tests): ICON_NAMES/ICON_DEFS set equality; a full-hub unknown-name scan with a sensitivity check (plants a typo, proves the scan actually catches it, not vacuous); the same self-consistency check for `states.js`. While writing the guard, caught a bug in the first regex draft — it only matched double-quoted keys but `states.js` uses single quotes for its two hyphenated keys (`'no-internet'`, `'connection-lost'`), so those two silently failed to match; fixed to accept both quote styles. **Live (port 8787):** Overview — 38 icons, 0 empty/fallback; VPN — 15; one cycle via `location.hash` — connection 20, internet-uplink 16, staff-wifi 15, guest-wifi 14, domain 18, entry-pages 14, diagnostics 13. **Total: 8 screens, 163 icons live, 0 empty, 0 fallback circles.** Overview screenshot visually confirmed contrast/size/clipping are all fine. `#/showcase` (the internal all-27-icon registry page) is not wired into the router in this build (redirects to `#/overview`) — not a blocker, the static test already covers the registry directly without needing to render it. Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-62."
  day_10_day_4_status_2026_08_07: "**2026-08-07 day, continuation — Main personally verified the §M-58 Overview card-grid redesign live and found+fixed a real runtime bug that every prior static/node-harness test had missed (§M-59).** Restarted the live host (old process on 8787 predated all of this session's code) and, on first real authenticated browser load, confirmed via accessibility-tree snapshot that the router card's three health-fact pills ('Отвечает'/'Доступ сохранён'/'Совпадает'), the internet card's read-only Wi‑Fi/Провод/Модем source segments (real SSID 'Netcraze-7619' shown, modem honestly muted), the domain checklist ('Имя домена указано'/'Событие не выбрано'), and the new 'Проверить всё' status-strip button all render with genuinely real data — no dBm, no router dropdown, no fabricated access/cert checks, matching the T2 contract exactly. **But** the new 'Состояние системы' + progress-ring header was silently empty (`childCount: 0`) in the live DOM despite every offline test passing. Root-caused by directly importing the live-served ES module into the browser's console and calling `buildOverviewReadinessHeader()` for real: `TypeError: Cannot set property className of #<SVGElement> which has only a getter` — `progress-ring.js` assigned `.className = '...'` on `svg`/`circle` elements created via `document.createElementNS`, but `SVGElement.className` is a read-only `SVGAnimatedString` getter in real browsers (unlike plain `HTMLElement.className`); the exception was thrown, `clearContainer()` had already emptied the wrapper, and nothing ever got appended — silently, on every single render, forever. Every prior verification layer (T2 adversarial-reviewer, verifier, 183 pytest) missed this because ALL of this project's JS 'tests' are either static regex/string assertions on source text, or pure-function node-harness calls with no `document` at all — none of them actually execute DOM-constructing code like `createProgressRing()` against a real (or even jsdom-shimmed) DOM, so a real-browser-only API misuse like this has zero offline oracle in the current test setup. Fixed directly (T0/T1, one file, `svg`/`track`/`progress`.setAttribute('class', ...) instead of assignment) — no Grok/Composer needed, root cause and fix were both fully mechanical and unambiguous. Added a new static regression test (`test_progress_ring_svg_elements_never_assign_class_name_property`) that specifically asserts none of the three SVG-namespaced variable names use `.className =` (correctly does NOT flag the sibling plain-`<div>` `wrap.className = ...` two lines above, which is legitimate) — verified the test fails on the original broken code and passes on the fix, so it is not a tautology. `CACHE_VERSION` `47→48`. 183/183 pytest green (was 182, +1 new test), `node --check` clean on all touched files, host restarted twice to pick up both the redesign and this fix. **Honest gap:** final re-confirmation of the FIXED ring rendering inside a fresh *authenticated* live browser session was not completed this cycle — the dev-mode session cookie invalidated across the two host restarts and Main declined to type the decrypted Hub admin password into any browser tool call (policy: never place the password where it could land in a transcript), and CSP on the login page blocks both dynamic `import()` of app modules and `eval`/`Function` outside the authenticated SPA context, closing off every safe workaround attempted. Confidence in the fix itself is still high (exact before/after reproduction of the same function with the same inputs, in a real browser JS engine, both via the live-served file), but a human or a future session should do one quick authenticated page load of `#/overview` to eyeball the ring — this is the pixel/live acceptance step, not a structural one. Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-59."
  day_10_day_3_status_2026_08_07: "**2026-08-07 day, continuation — Overview main screen redesigned as a compact card grid, per operator-supplied reference screenshot, delegated to `operational-orchestrator` (Grok) as explicitly requested (§M-58).** Task Contract (T2): a responsive grid of status cards (icon+title+badge+1-2 lines of metric) reusing the already-existing `createStatusCard` primitive, one card each for router/internet, staff network, guest network, VPN, domain, entry pages, on top of the existing summary banner — with all existing state logic (offline, connection-restore, management-username recovery, host-key confirmation, VPN activate/deactivate, domain publish flow, refresh/heartbeat intervals) explicitly required to be preserved unchanged, and the reference's 'Последние события' (recent events) list explicitly ruled OUT OF SCOPE since no backend audit-log API is exposed to the frontend — the contract forbade fabricating fake event data. T2 pipeline (explore→plan→implementer→adversarial-reviewer, 2 review cycles, 0 blockers→verifier) returned `outcome: done`, `CACHE_VERSION` 42→44, 88/88 in the targeted test files. Main personally re-verified rather than trusting the report at face value: read the new `overview-card-grid.js` helper module and the changed `overview.js` sections line-by-line, confirmed all card data comes from already-existing model fields (`model.router`, `model.domain`) with nothing invented, confirmed all three `iconName` values used genuinely exist in `ICON_NAMES`, confirmed clean removal of the now-redundant secondary-nav links with no dangling references; personally re-ran `node --check` on both changed JS files (clean) and `pytest tests/test_hub_overview.py tests/test_hub_module_bindings.py` (88/88) plus a wider regression sweep (`test_hub_uplink_wifi.py`+`test_ui_host.py`+`test_config_ui.py`, 82/82) directly, not just trusting the subagent's verifier. Live browser structural check after activating the new service worker confirmed the router card genuinely renders real data (`Lab NC-1812 (192.168.2.1)` / `netcraze NC-1812` / `Готово` / `192.168.2.1`) and is keyboard/link-navigable, the domain card shows the existing honest 'no live check' note, and VPN/networks are grouped into separate grid cells. **Honest limitation:** an actual pixel-level screenshot for final visual review failed twice in a row due to the browser extension's execution backend disconnecting mid-session (an environment issue in this session, not a code finding) — structural (accessibility-tree) verification passed, but the operator should personally glance at the live page once to confirm the pixel-level 'compact and visually pleasant' bar is met. Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-58."
  day_10_day_2_status_2026_08_07: "**2026-08-07 day, continuation — operator turned VPN off and asked to set up the Wi-Fi connection 'so it works the way I need' (§M-57).** The router was already really connected to Wi-Fi (`WifiMaster1/WifiStation0`, SSID `Netcraze-7619`, 5GHz, `internet: true`, `captive_accessible: true`) from earlier session work, but had never gone through the product's own connect flow, so `remembered_uplink.desired_active` was still `0` (a no-op watchdog despite §M-56's fix being live). Fixed WITHOUT re-entering the password or touching the already-working connection: found the existing, non-revoked `credential_ref` registered for this exact network back in §M-24, and called `PUT /remembered-uplink` directly (the same persistence path the UI calls after a normal connect) with that existing ref + `desired_active=true`. Live-confirmed: both Overview and 'Интернет' now show 'Сохранено на хосте: «Netcraze-7619» (5 ГГц)' / 'Запомнено для автоподключения: ...'; the watchdog is no longer a verified no-op. **While verifying this, found and fixed a REAL, previously-undetected bug closing the exact honest gap flagged in `day_10_morning_2_status_2026_08_07`/§M-55 ('SSID confirmed at data level, not proven end-to-end via UI since real gateway was VPN, not Wi-Fi').** Now that the real gateway genuinely is Wi-Fi, direct verification showed the 'Интернет' screen still displayed the raw technical interface id instead of the SSID, even though a live network-response interception (temporary CDP `window.fetch` monkey-patch, diagnostic-only, not left in code) proved the raw API response already carried `gateway_ssid: 'Netcraze-7619'` correctly. Root cause: `router_control_host/web/hub/features/diagnostics-model.js::normalizeRouterInternetObserve` — the shared normalizer function sitting between the network fetch and the render layer, used by BOTH the Overview and 'Интернет' screens — whitelisted response fields and simply never included `gateway_ssid`, silently stripping it before it ever reached `describeInternetSource()`. The existing `describeInternetSource()` unit test from §M-55 did not catch this because it tested the render function in isolation with a hand-built object, bypassing the actual normalizer entirely — a real instance of the general lesson 'testing only the final render function misses bugs in the pipeline stage before it.' Fixed: added `gateway_ssid` to the normalizer's whitelist and JSDoc typedef (one-line addition, T0/T1, done directly without Grok/Composer); added a new regression test (`test_normalize_router_internet_observe_passes_through_gateway_ssid` in `tests/test_hub_uplink_wifi.py`) that exercises the normalizer itself, not just the render function; bumped `CACHE_VERSION` 41→42 immediately (the recurring papercut did not repeat this time); `node --check` clean; 100/100 in the affected test files. **Live-verified after the fix:** activated the new service worker, navigated to 'Интернет' via Overview (so live session params were already restored) — the source card now genuinely shows 'Сейчас: Wi‑Fi («Netcraze-7619»)' — the first real end-to-end confirmation of SSID display against an actual Wi-Fi gateway (previously only confirmed at the data layer, since the real gateway had been VPN). Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-57."
  day_10_day_status_2026_08_07: "**2026-08-07 day, continuation — uplink-watchdog auto-reconnect made router-load-safe by design, not just enabled (§M-56).** Operator described the desired Overview screen behavior in three points: (1) router connection status; (2) router Wi-Fi uplink status with click-to-select-network + password + remember + auto-reconnect when a known network reappears, explicitly specifying the monitoring architecture — once connected, monitor internet reachability WITHOUT hitting the router (cheap host-side check, e.g. like pinging Google), only checking the router itself when something looks wrong; (3) view/switch the active VPN. Audit found (1) and (3), plus most of (2), already built and live in prior sessions — did not reinvent anything, only closed one real gap: the existing (already-written, already-tested) `router_control/application/uplink_watchdog_service.py::UplinkWatchdogHandle` auto-reconnect mechanism was (a) disabled on the live host (`UPLINK_WATCHDOG_ENABLED` was never set in the startup command) and (b) hit the router via SSH (`run_internet_status_observe`) on EVERY poll cycle (default 45s) regardless of whether anything was actually wrong — exactly the router-load pattern the operator asked to avoid, just in a different subsystem than the Overview heartbeat already fixed for this exact concern in `day_10_morning_2_status_2026_08_07`/§M-55. Fixed: added an injectable `host_internet_probe: Callable[[], bool | None] | None` to `UplinkWatchdogHandle`; in `_poll_once`, when wired, a cheap host-side probe (`asyncio.to_thread`, no router SSH) runs FIRST — if it reports internet reachable, the cycle resets state and returns with ZERO router SSH calls; only False/None/an exception falls through to the pre-existing router-side check+reapply logic unchanged. Wired in `router_control_host/app.py`'s `lifespan()` to reuse the exact same `host.host_probe_runner`/`DefaultHostProbeRunner.probe_internet(targets_profile='default')` DNS+TCP-to-Cloudflare/Google check already exposed as `/lab/host-internet-probe` and already used by the Overview heartbeat — one probe implementation, two consumers. 5 new offline tests (host-probe True skips SSH entirely; False/None/raises falls through unchanged; no-probe-wired preserves old behavior byte-for-byte) — 19/19 green in `test_uplink_watchdog_service.py` (was 14), plus 91/91 in a broader regression sweep (`test_host_api.py`, `test_wifi_live_wiring.py`, `test_ui_host.py`, `test_gate_a_refresh_watchdog.py`), ruff/mypy clean. **Live-verified by Main personally:** restarted the host on 8787 with `UPLINK_WATCHDOG_ENABLED=1` added to the startup command; startup log clean, zero exceptions; `GET /remembered-uplink/watchdog-status` → `{enabled: true, poll_seconds: 45.0, running: true}`; `POST /lab/host-internet-probe` (the exact same code path the watchdog now calls internally) → `internet_reachable: true` in this network, confirming the wiring is live and functional; Overview screen reloaded with zero regressions (`Система готова к работе`, `Сейчас: VPN`, same as before restart). **Honest scope limit — this session did NOT live-prove the full R-2 reconnect scenario end to end.** Read directly from the live database: `remembered_uplink.desired_active = 0` — nobody has yet gone through the 'Интернет' screen's connect flow to save a real Wi-Fi network as the remembered uplink, so the watchdog, while enabled and running, is currently a verified no-op (confirmed: `_poll_once`'s pre-existing `desired_active` check returns before ever reaching the new host-probe code). A full live proof of 'real Wi-Fi disconnect → watchdog detected it → reconnected' still requires: connect+remember a real network via 'Интернет' → physically or via RCI break that Wi-Fi session → wait ≥2 poll cycles (~90s) → confirm restoration. That remains the next step for R-2, not closed by this entry — same honest gap as previously recorded in `docs/OPERATOR_SIMPLE_MAIN_MENU_SPEC.md` R-2 row, just now on a router-load-safe implementation instead of a router-hammering one. Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-56."
  day_10_morning_2_status_2026_08_07: "**2026-08-07 morning, continuation — show which Wi-Fi network the router's uplink is actually connected to, and reduce routine router SSH load (§M-55).** Operator asked for two related things: (1) display the actual connected Wi-Fi SSID, not just a technical interface identifier; (2) stop hammering the router with live SSH probes constantly for internet-status checks — do a real router-side check only every ~5 minutes, and the rest of the time just verify internet reachability cheaply (e.g. like pinging Google) from the machine running the Hub, escalating to a real router check immediately if that cheap check detects an outage. Found the needed infrastructure already existed: `router_control_host/host_probes.py::DefaultHostProbeRunner.probe_internet` (exposed as `POST /lab/host-internet-probe`) already does exactly this DNS+TCP reachability check against Cloudflare/Google from the Hub's own machine, with zero router SSH — it was already built and tested but only wired into the 'Домен' screen, not into the Overview screen's routine monitoring. Shipped: `internet_status_observe.py` now makes one best-effort extra `show interface <id>` call (on the SAME already-open transport, no new SSH session) to add a `gateway_ssid` field whenever the gateway is a Wi-Fi station interface, surfaced in `internet-source-block.js` as `Сейчас: Wi‑Fi «SSID»` instead of a raw technical string, with full graceful fallback when unavailable; `overview.js`'s full router refresh interval changed from 60s to 300s (5 min), plus a new independent 60s host-only 'heartbeat' (no router touch) that triggers an early full refresh ONLY on a confirmed true→false internet-reachability transition (never on the initial unknown baseline or repeated already-down ticks) — the detailed banner text keeps using ONLY real router-side data as its source of truth; the heartbeat purely schedules when to refresh it sooner. Verified offline: 193+114 tests green, ruff/mypy/node --check clean; an independent verifier confirmed the transition-detection semantics line-by-line and that the new field addition to the `InternetStatusObservation` frozen dataclass doesn't break any existing construction site. Live-verified by Main personally: restarted the host, bumped `sw.js` `CACHE_VERSION` 40→41 (the implementer again did not touch the service worker — same recurring gap as previous cycles), activated the new SW, confirmed Overview shows 'Система готова к работе'. The router's current real gateway is VPN (`Wireguard9`), not Wi-Fi, so `gateway_ssid` correctly stays `null` right now (confirmed via a direct `/internet-status/observe` call). Rather than disrupt the current working VPN routing just to exercise the new SSID path end-to-end, ran a separate read-only `show interface WifiMaster1/WifiStation0` RCI probe via the existing `scripts/rci-parse.py` — the real device returned `\"ssid\": \"Netcraze-7619\"`, exactly the field/shape `parse_station_associated_ssid` parses, confirming the mechanism will work correctly whenever/if that Wi-Fi uplink becomes the active gateway again, without needing to actually switch live routing just to prove it. Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-55."
  day_10_morning_status_2026_08_07: "**2026-08-07 morning — first-attempt router connection failures fixed (§M-54).** Operator reported a reproducible pattern: on fresh page load or after a host restart, the connection-health check would show 'Нет связи с роутером' but a manual 'Проверить систему' retry immediately after always succeeded — asked for first-attempt success. Root cause found from the live host's OWN log evidence from the prior night's restart (§M-53): the Overview screen fires several independent live SSH-probing requests concurrently on load (connection-health, wifi/observed-state, vpn-profiles/catalog-status, internet-status/observe), each opening its own separate SSH session to the same lab router; the router's embedded SSH daemon intermittently resets/drops a session when hit with several near-simultaneous fresh handshakes (`Error reading SSH protocol banner` / `paramiko.ssh_exception.SSHException` immediately followed by a 503 on one endpoint while sibling concurrent requests succeeded in the same burst). Considered a broader fix (global per-router SSH concurrency lock, mirroring the existing WireGuard `router_apply_lock.py`) but that trips the tier-rubric's Minimum T3 hard override ('concurrency/race correctness') requiring a full T2+Sol pre-write cycle — deliberately did not take that on right now without a dedicated decision. Instead shipped a narrower, T1-scope fix: `router_control/adapters/netcraze/ssh_tunnel.py` now automatically retries ONCE (new `SshTransientConnectionError(SshTunnelError)`, `connect_retry_attempts=2` default, `connect_retry_delay_seconds=0.5`) on genuinely transient connect/handshake failures inside both `PinnedSshTunnel.open()` and the structurally-identical sibling `PinnedSshTransport.open()` (found and fixed symmetrically — used by read-only discovery/fail-safe paths without RCI forward, same exact latent bug) — identity/auth-relevant failures (`SshHostKeyMismatch`, `SshSourceAddressBindError`, genuine `SshTunnelError` auth failure) are never retried, only the generic transient-network branch. Since the new exception subclasses `SshTunnelError`, every existing caller (e.g. `SoftConnectionHealthProbe.probe()`) keeps working unchanged via inheritance — zero other files touched. Verified: 65/65 tests in `test_netcraze_ssh_tunnel.py` (new + pre-existing), 160 in a broad regression sweep, ruff/mypy clean; an independent verifier confirmed line-by-line that the retry loop only catches the transient subclass, respects the attempt-count cap, and that all 15 existing `SshTunnelConfig(...)` construction sites in the repo are keyword-only (no positional-argument regression risk from appending the two new fields to the frozen dataclass). Live-verified by Main personally: restarted the live host on 8787 to pick up the new code, then did 3 consecutive full cold reloads of `#/overview` (the exact path that previously showed first-attempt failures) — all three succeeded on the first try ('Система готова к работе / Все проверки связи пройдены') with zero manual retries needed. Given the bug's intermittent nature this is not mathematical proof of permanent closure, but the root cause is evidence-backed (from the project's own log, not a guess) and the fix directly automates the exact workaround the operator had already discovered by hand. Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-54."
  day_9_evening_2_status_2026_08_06: "**2026-08-06 evening, continuation — the operator sent a live UI screenshot still showing 'Свежесть проверки: Не пройдено' after `day_9_evening_status_2026_08_06`'s file-level automation, with an explicit ask that promo staff must never see this because they understand nothing technical.** Root cause: `router_control_host/app.py` loads `try_load_gate_a_certification()` **once** at process startup into `HostState.gate_a_certification` (a frozen dataclass) and dozens of routes (`wifi_apply_routes.py`, `wireguard_apply_routes.py`, `wifi_station_apply_routes.py`, `vpn_catalog_status_routes.py`, `connection_health_routes.py`) read that SAME cached object on every request — so an already-running host process keeps reporting stale freshness (and would genuinely block live writes with `gate.a_closed` after ~24h of uptime) no matter how fresh the on-disk file is kept, unless the process restarts. Fixed by adding `router_control/application/gate_a_refresh_watchdog.py`, a background asyncio watchdog mirroring the existing `vpn_watchdog_service.py` pattern: reloads the certification from disk every `GATE_A_REFRESH_POLL_SECONDS` (default 120s) and swaps `host.gate_a_certification` to the fresh object — **enabled by default** (unlike the VPN watchdog) since it is a purely read-only, side-effect-free local reload; on any load failure/exception it deliberately leaves the last-known-good certification untouched (never nulls it out). Wired into `app.py`'s `lifespan()` exactly like the other watchdogs, only when `adapter_mode == 'live'` and a cert was loaded. 7 new offline tests + full existing Gate A suite (103) green. Side finding fixed in the same cycle: two golden-pin tests in `tests/test_gate_a_certification.py` hardcoded the exact evidence pointer/timestamp/sha256 as Python constants — sustainable for once-a-day manual bumps, but would break every few hours now that recerts can happen automatically; rewritten to dynamic invariants (parse+hash-verify the CURRENT pointer, call the real `load_gate_a_certification(..., now=datetime.now(UTC))` and assert `is_open_at`, assert `recertification_reason` prefix instead of exact string) — 24/24 green, will keep passing for any future legitimate same-tuple recert. **Live proof, right now:** found the live host on 8787 (PID 26168, started 07:49 UTC that same morning — before both this fix and the earlier file-level automation), stopped it by exact PID, restarted identically to prior sessions (DPAPI-decrypted `HUB_ADMIN_PASSWORD` in-process only, `RC_ADAPTER_MODE=live`, `ROUTER_CONTROL_LAB_CLASS=expendable_development_router`, `VPN_WATCHDOG_ENABLED=1`), then through `cursor-ide-browser` on the already-open `#/connection` tab clicked «Проверить снова» (a plain hash-route navigate to the same URL did not force a real re-fetch — expected SPA behaviour, not a bug) — the 'Свежесть проверки' row flipped from 'Не пройдено' to **'Проверка свежая'**. From this restart onward, future refreshes of the file (by the scheduled task every ≤4h, or its logon fallback) will be picked up by the running host's watchdog automatically, with no further restart ever needed for this specific problem again."
  day_9_evening_status_2026_08_06: "**2026-08-06 evening — Gate A same-tuple freshness recertification is now AUTOMATED (§M-53), closing the operator's exact complaint 'Свежесть проверки не пройдена'.** Root problem: the opening-freshness window (`opening_freshness_hours=24` in `docs/gate-a-certification.json`) had been refreshed manually by Main five days running (`evidence_freshness_recertification_same_tuple_202608{01..05}`) — the same read-only SSH probe + same-tuple check + JSON edit, every ~24h, with no automation. Built (delegated to `implementer`, Composer 2.5, per T0/T1 skip-Grok routing) and personally live-verified: `scripts/gate_a_freshness_lib.py` (pure, fail-closed `evaluate_and_apply` — ANY tuple field mismatch or `certification_eligible`/`identity_complete` not both true leaves `docs/gate-a-certification.json` completely untouched and returns a non-zero exit; only a byte-for-byte tuple match ever updates the evidence pointer + appends to `previous_certifications`), `scripts/recertify-gate-a-freshness.py`/`.ps1` (CLI wrapping the existing `probe-gate-a.py`, zero new SSH/DPAPI logic), `tests/test_gate_a_freshness_automation.py` (7/7 offline, incl. a round-trip through the real `load_gate_a_certification`), and `scripts/install-gate-a-freshness-task.ps1`/`uninstall-...ps1` for unattended scheduling. Three real bugs found and fixed during live testing (not just style): (1) `-File ... *>> log` redirection silently doesn't work in `New-ScheduledTaskAction` (fixed to `-Command \"& '...' *>> '...'\"`); (2) `[TimeSpan]::MaxValue` produces an invalid Task Scheduler XML duration (fixed to `New-TimeSpan -Days 3650`); (3) **the whole `ScheduledTasks` PowerShell module (`Register-ScheduledTask`) returns `Access is denied (0x80070005)` in this machine's non-elevated session regardless of run-as user** — rewritten onto `schtasks.exe /rl LIMITED` (empirically confirmed to work without elevation), as two separate tasks (`-Interval` HOURLY/4h, `-Logon` — `/sc ONLOGON` also needs elevation here, so it auto-falls back to `/sc MINUTE /mo 30` with an explicit warning, which self-heals at least as fast). Live proof, right now, on the real router 192.168.2.1: forced a real probe — tuple matched byte-for-byte (`drifted_fields=0`), `docs/gate-a-certification.json` updated, new evidence `data/artifacts/gate-a-probe-auto-20260806T184457Z.json` (`evidence_recorded_at` 2026-08-06T18:45:00Z), old pointer correctly superseded; confirmed via the actual product loader `load_gate_a_certification().is_open_at(now) == True` (not just eyeballing JSON). Both scheduled tasks are registered and live under `MIHA\\katko` (`RouterControl-GateA-FreshnessAuto-Interval`, `-Logon`); a manual `schtasks /run` trigger correctly logged `not_due` (the window had just been refreshed seconds earlier) — proving the automation makes the right decision, not a failure. **Honest limits:** this only automates the already-repeated SAME-TUPLE refresh path; a genuine future tuple drift (real hardware/component change) still fails closed and still requires a human/Main decision — silent rebind remains forbidden and is unaffected by this change. The scheduled tasks only run while `MIHA\\katko` is logged into Windows (matches the pre-existing DPAPI CurrentUser interactive-session requirement). Full narrative: `.cursor/plans/main-decisions-local-hub.md` §M-53; runbook: `docs/OPERATOR_GATE_A.md` §20."
